          description: Peers of the requested stock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquityRelatedStocksResponse'
              example:
                success: true
                statusCode: 200
                data:
                  basis: sector33
                  sector:
                    code: '3700'
                    name: Transportation Equipment
                  items:
                    - symbol: '72670'
                      code: '7267'
                      name: HONDA MOTOR CO.,LTD.
                      price: 1520.5
                      change: 12
                      changePercent: 0.7955
                      tradingDate: '2026-09-30'
                      marketCap: 8235000000000
                meta:
                  source:
                    - jquants:/v2/equities/bars/daily
                    - jquants:/v2/equities/master
                  as_of: '2026-09-30'
                  unit: JPY
                  classification: RAW+COMPUTED
                  formula_version: price-change-v2
                  was_restated: false
                  served_from_cache: true
                  cache_expires_at: '2026-10-01T14:00:00.000Z'
                  timestamp: '2026-10-01T08:00:00.000Z'
        '400':
          description: Unsupported market, or an invalid query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                success: false
                statusCode: 400
                error:
                  code: MARKET_NOT_SUPPORTED
                  message: Thị trường "us" chưa được hỗ trợ — hiện chỉ có jp
                meta:
                  error: Bad Request
                  statusCode: 400
                  timestamp: '2026-10-01T08:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The stock code is not in the J-Quants listing or is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                success: false
                statusCode: 404
                error:
                  code: EQUITY_NOT_FOUND
                  message: Không tìm thấy mã cổ phiếu 99999
                meta:
                  error: Not Found
                  statusCode: 404
                  timestamp: '2026-10-01T08:00:00.000Z'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    HayInsightsApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Your HayInsights API key (prefixed `apk_`). Create and manage keys in the
        HayInsights dashboard (Account → API keys).

        Send it in the `X-API-Key` header on **every** request to `/openapi/v1/*`.
        Which data domains you may access and your request quota are both governed by
        the subscription plan attached to the key — see the **Plans & features** and
        **Rate limits** guides.
  schemas:
    CommodityCategory:
      type: string
      enum:
        - energy
        - metals
        - agriculture
        - macro
      description: Commodity category.
      example: metals
    SortOrder:
      type: string
      enum:
        - asc
        - desc
      default: desc
      description: Sort direction.
      example: desc
    Meta:
      type: object
      description: Response metadata. Always present; `timestamp` is the server time the response was generated.
      required:
        - timestamp
      properties:
        timestamp:
          type: string
          format: date-time
          description: Server time when the response was generated (ISO 8601).
          example: '2026-06-19T08:31:59.478Z'
      additionalProperties: true
    EnvelopeBase:
      type: object
      description: |
        Standard success envelope shared by every endpoint. Each operation's response
        wrapper extends this (via `allOf`) and adds a typed `data` property.
      required:
        - success
        - statusCode
      properties:
        success:
          type: boolean
          const: true
          description: Always `true` for a successful response.
          example: true
        statusCode:
          type: integer
          description: Mirrors the HTTP status code.
          example: 200
        meta:
          $ref: '#/components/schemas/Meta'
    CommodityPrice:
      type: object
      description: Latest price snapshot for a single commodity.
      required:
        - id
        - name
        - category
        - unit
        - lastClose
        - currency
      properties:
        id:
          type: string
          description: Commodity slug — use as the `{id}` path param for history.
          example: zinc-lme
        name:
          type: string
          example: Zinc (LME)
        category:
          $ref: '#/components/schemas/CommodityCategory'
        unit:
          type: string
          example: USD/ton
        lastClose:
          type:
            - number
            - 'null'
          description: Most recent closing price.
          example: 3588
        currency:
          type: string
          example: USD
        change1dPct:
          type:
            - number
            - 'null'
          description: 1-day percentage change.
          example: 0.53
        changeMtdPct:
          type:
            - number
            - 'null'
          description: Month-to-date percentage change.
          example: 0.28
        changeYtdPct:
          type:
            - number
            - 'null'
          description: Year-to-date percentage change.
          example: 14.63
        ma50:
          type:
            - number
            - 'null'
          description: 50-period moving average.
          example: 3475.3036
        trend:
          type:
            - string
            - 'null'
          enum:
            - bullish
            - bearish
            - null
          description: Trend classification derived from the moving average.
          example: bullish
        trendline:
          type: array
          description: Recent closing prices, oldest→newest, for a sparkline.
          items:
            type: number
        updatedAt:
          type: string
          format: date-time
          example: '2026-06-17T00:00:00.000Z'
    CommoditiesListResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CommodityPrice'
    ErrorDetail:
      type: object
      description: Error detail object carried under `error` in the error envelope.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: |
            Machine-readable error code. Specific for authentication / quota errors
            (e.g. `API_KEY_REQUIRED`, `API_KEY_INVALID`, `FEATURE_NOT_IN_PLAN`,
            `RATE_LIMIT_EXCEEDED`). For validation (400) and not-found (404) the code
            is currently `INTERNAL_ERROR` and the HTTP status carries the semantics.
          example: API_KEY_INVALID
        message:
          description: Human-readable message, or a list of validation messages (400).
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: Invalid API key
    ErrorBody:
      type: object
      description: Standard error envelope returned for every 4xx / 5xx response.
      required:
        - success
        - statusCode
        - error
      properties:
        success:
          type: boolean
          const: false
          description: Always `false` for an error response.
          example: false
        statusCode:
          type: integer
          description: Mirrors the HTTP status code.
          example: 401
        error:
          $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/Meta'
    FeaturedCommodity:
      type: object
      description: A featured commodity with a short price sparkline.
      required:
        - id
        - name
        - unit
        - lastClose
        - currency
        - change1dPct
        - changeValue
        - trendline
      properties:
        id:
          type: string
          example: gold
        name:
          type: string
          example: Gold
        unit:
          type: string
          example: USD/oz
        lastClose:
          type:
            - number
            - 'null'
          example: 4189.22
        currency:
          type: string
          example: USD
        change1dPct:
          type:
            - number
            - 'null'
          description: 1-day percentage change.
          example: 0.02
        changeValue:
          type:
            - number
            - 'null'
          description: 1-day absolute price change.
          example: 0.77
        trendline:
          type: array
          description: Recent closing prices, oldest→newest, for a sparkline.
          items:
            type: number
    CommoditiesFeaturedResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/FeaturedCommodity'
    CommodityMover:
      type: object
      description: A single commodity in a movers (gainers / losers) list.
      required:
        - id
        - name
        - changePct
      properties:
        id:
          type: string
          example: coffee-robusta
        name:
          type: string
          example: Coffee Robusta
        changePct:
          type: number
          description: Percentage change over the requested period.
          example: 7.35
    CommodityMovers:
      type: object
      description: Top gaining and losing commodities over a period.
      required:
        - period
        - gainers
        - losers
      properties:
        period:
          type: string
          description: Period the movers are computed over.
          example: mtd
        gainers:
          type: array
          items:
            $ref: '#/components/schemas/CommodityMover'
        losers:
          type: array
          items:
            $ref: '#/components/schemas/CommodityMover'
    CommoditiesMoversResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/CommodityMovers'
    IndexedPricePoint:
      type: object
      description: One point of a rebased price series (percentage change vs the series start).
      required:
        - date
        - value
        - pctChange
      properties:
        date:
          type: string
          format: date
          example: '2026-03-22'
        pctChange:
          type: number
          description: Percentage change versus the first point in the series.
          example: 0
        value:
          type: number
          description: Raw value on this date.
          example: 4464.66
    GoldDxyCorrelation:
      type: object
      description: Rebased gold and US Dollar Index (DXY) series for correlation analysis.
      required:
        - period
        - series
      properties:
        period:
          type: string
          description: Look-back window.
          example: 3m
        series:
          type: object
          required:
            - gold
            - dxy
          properties:
            gold:
              type: array
              items:
                $ref: '#/components/schemas/IndexedPricePoint'
            dxy:
              type: array
              items:
                $ref: '#/components/schemas/IndexedPricePoint'
    CommoditiesGoldDxyResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/GoldDxyCorrelation'
    CommodityHistoryPoint:
      type: object
      description: One closing price in a commodity's history series.
      required:
        - date
        - close
      properties:
        date:
          type: string
          format: date
          example: '2026-03-19'
        close:
          type: number
          example: 4651.73
    CommodityHistoryResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CommodityHistoryPoint'
    CryptoTrendingCoin:
      type: object
      description: A trending coin in the market overview — a notable 24h gainer or loser.
      required:
        - symbol
        - name
        - rank
        - priceChange24h
        - tag
      properties:
        symbol:
          type: string
          description: Ticker symbol of the coin.
          example: FF
        name:
          type: string
          example: Falcon Finance
        rank:
          type: integer
          description: Market-cap rank of the coin.
          example: 98
        priceChange24h:
          type: number
          description: 24-hour price change, as a percentage.
          example: 99.3142
        tag:
          type: string
          enum:
            - new
            - top-gainer
            - top20-mover
            - gainer
          description: Trend category of the coin — newly added, top gainer, top-20 mover, or gainer.
          example: gainer
    CryptoOverview:
      type: object
      description: |
        Crypto market overview — total market capitalisation, 24h volume, BTC/ETH/major
        dominance split, the Fear & Greed index and a list of trending coins.
      required:
        - totalMarketCap
        - volume24h
        - marketCapChange24h
        - volumeChange24h
        - dominance
        - fearGreed
        - trending
      properties:
        totalMarketCap:
          type: number
          description: Total crypto market capitalisation in USD.
          example: 2156391783530.09
        volume24h:
          type: number
          description: Total 24-hour trading volume in USD.
          example: 74938670897.24
        marketCapChange24h:
          type: number
          description: 24-hour change in total market cap, as a percentage.
          example: -2.6314
        volumeChange24h:
          type: number
          description: 24-hour change in total trading volume, as a percentage.
          example: -11.6008
        dominance:
          type: object
          description: Market-cap dominance split (percentage) across major coins.
          required:
            - btc
            - eth
            - bnb
            - sol
            - xrp
            - other
          properties:
            btc:
              type: number
              example: 58.148
            eth:
              type: number
              example: 9.476
            bnb:
              type: number
              example: 3.585
            sol:
              type: number
              example: 1.843
            xrp:
              type: number
              example: 3.242
            other:
              type: number
              description: Combined dominance of all other coins.
              example: 23.706
        fearGreed:
          type:
            - object
            - 'null'
          description: Crypto Fear & Greed index reading.
          required:
            - value
            - classification
            - date
          properties:
            value:
              type: integer
              description: Index value from 0 (extreme fear) to 100 (extreme greed).
              example: 19
            classification:
              type: string
              description: Human-readable classification of the index value.
              example: Extreme fear
            date:
              type: string
              format: date
              description: Date the index reading applies to.
              example: '2026-06-18'
        trending:
          type: array
          description: Notable trending coins (top gainers / losers).
          items:
            $ref: '#/components/schemas/CryptoTrendingCoin'
    CryptoOverviewResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/CryptoOverview'
    CryptoBubbleCoin:
      type: object
      description: A single coin rendered as a bubble on the market bubble map.
      required:
        - symbol
        - name
        - marketCap
        - change
        - size
      properties:
        symbol:
          type: string
          description: Ticker symbol of the coin.
          example: BTC
        name:
          type: string
          example: Bitcoin
        marketCap:
          type: number
          description: Market capitalisation in USD.
          example: 1254560380643.96
        change:
          type: number
          description: Price change over the requested timeframe, as a percentage.
          example: -2.9057
        size:
          type: number
          description: Normalised bubble size (0–1) relative to the largest coin.
          example: 1
    CryptoBubbleMap:
      type: object
      description: |
        Bubble-map dataset — the top coins by market cap with their price change over a
        selected timeframe and a normalised bubble size for visualisation.
      required:
        - timeframe
        - coins
      properties:
        timeframe:
          type: string
          enum:
            - 1h
            - 1d
            - 1w
          description: Timeframe the price changes are computed over.
          example: 1d
        coins:
          type: array
          description: Coins to render as bubbles, ordered by market cap (largest first).
          items:
            $ref: '#/components/schemas/CryptoBubbleCoin'
    CryptoBubbleMapResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/CryptoBubbleMap'
    CryptoOnchain:
      type: object
      description: |
        On-chain network metrics — Ethereum gas prices, Bitcoin hashrate and active
        addresses, whale transaction count and the MVRV / NUPL valuation indicators.
      required:
        - ethGas
        - btcHashrate
        - btcActiveAddresses
        - whaleTxCount
        - mvrv
        - nupl
      properties:
        ethGas:
          type:
            - object
            - 'null'
          description: Ethereum gas price tiers.
          required:
            - safe
            - standard
            - fast
            - baseFee
            - unit
          properties:
            safe:
              type:
                - number
                - 'null'
              description: Gas price for a low-priority (safe) transaction.
              example: 0.084424998
            standard:
              type:
                - number
                - 'null'
              description: Gas price for a standard-priority transaction.
              example: 0.08533128
            fast:
              type:
                - number
                - 'null'
              description: Gas price for a high-priority (fast) transaction.
              example: 0.093864408
            baseFee:
              type:
                - number
                - 'null'
              description: Current network base fee.
              example: 0.0843841
            unit:
              type: string
              description: Unit the gas prices are expressed in.
              example: gwei
        btcHashrate:
          type:
            - object
            - 'null'
          description: Bitcoin network hashrate.
          required:
            - value
            - unit
          properties:
            value:
              type: number
              example: 1024.72
            unit:
              type: string
              description: Unit the hashrate is expressed in.
              example: EH/s
        btcActiveAddresses:
          type:
            - integer
            - 'null'
          description: Number of active Bitcoin addresses.
          example: 503361
        whaleTxCount:
          type:
            - integer
            - 'null'
          description: Number of large ("whale") transactions observed.
          example: 29766
        mvrv:
          type:
            - object
            - 'null'
          description: Market-Value-to-Realised-Value ratio and its valuation zone.
          required:
            - value
            - zone
          properties:
            value:
              type: number
              example: 1.1772253837760067
            zone:
              type: string
              enum:
                - undervalued
                - fair_value
                - overheating
                - overvalued
              description: Valuation zone derived from the MVRV value.
              example: fair_value
        nupl:
          type:
            - object
            - 'null'
          description: Net Unrealised Profit / Loss and its sentiment zone.
          required:
            - value
            - zone
          properties:
            value:
              type: number
              example: 0.1586
            zone:
              type: string
              enum:
                - capitulation
                - hope_fear
                - optimism
                - belief
                - euphoria
              description: Sentiment zone derived from the NUPL value.
              example: hope_fear
    CryptoOnchainResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/CryptoOnchain'
    CryptoOpenInterest:
      type: object
      description: Open interest for a single perpetual-futures contract.
      required:
        - symbol
        - value
        - unit
      properties:
        symbol:
          type: string
          description: Contract symbol.
          example: BTCUSDT
        value:
          type: string
          description: Open interest, expressed in the contract's settlement unit.
          example: '98678.224'
        unit:
          type: string
          description: Unit the open interest is expressed in.
          example: USDT
    CryptoFundingRate:
      type: object
      description: Funding rate for a single perpetual-futures contract.
      required:
        - rate
        - annualized
      properties:
        rate:
          type: number
          description: Current per-interval funding rate.
          example: 0.00000854
        annualized:
          type: number
          description: Funding rate annualised, as a percentage.
          example: 0.93513
    CryptoDerivatives:
      type: object
      description: |
        Derivatives-market metrics — open interest, funding rates, 24h liquidations and
        the options put/call ratio for the major coins.
      required:
        - openInterest
        - fundingRate
        - liquidations24h
        - putCallRatio
      properties:
        openInterest:
          type: object
          description: Perpetual-futures open interest per coin.
          required:
            - btc
            - eth
          properties:
            btc:
              oneOf:
                - $ref: '#/components/schemas/CryptoOpenInterest'
                - type: 'null'
            eth:
              oneOf:
                - $ref: '#/components/schemas/CryptoOpenInterest'
                - type: 'null'
        fundingRate:
          type: object
          description: Perpetual-futures funding rate per coin.
          required:
            - btc
            - eth
          properties:
            btc:
              oneOf:
                - $ref: '#/components/schemas/CryptoFundingRate'
                - type: 'null'
            eth:
              oneOf:
                - $ref: '#/components/schemas/CryptoFundingRate'
                - type: 'null'
        liquidations24h:
          type:
            - object
            - 'null'
          description: Total long and short liquidations over the last 24 hours, in USD.
          required:
            - total
            - long
            - short
          properties:
            total:
              type:
                - number
                - 'null'
              example: 600914130.33
            long:
              type:
                - number
                - 'null'
              description: Value of liquidated long positions.
              example: 515261276.52
            short:
              type:
                - number
                - 'null'
              description: Value of liquidated short positions.
              example: 85652853.81
        putCallRatio:
          type: object
          description: Options put/call ratio per coin.
          required:
            - btc
          properties:
            btc:
              type:
                - object
                - 'null'
              required:
                - ratio
                - putOi
                - callOi
              properties:
                ratio:
                  type: number
                  description: Put open interest divided by call open interest.
                  example: 0.633
                putOi:
                  type: number
                  description: Open interest in put options.
                  example: 169791
                callOi:
                  type: number
                  description: Open interest in call options.
                  example: 268093
    CryptoDerivativesResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/CryptoDerivatives'
    CryptoDominanceCoin:
      type: object
      description: Market-cap dominance entry for a single coin.
      required:
        - symbol
        - name
        - dominancePercentage
        - marketCap
      properties:
        symbol:
          type: string
          description: Ticker symbol of the coin.
          example: BTC
        name:
          type: string
          example: Bitcoin
        dominancePercentage:
          type: number
          description: Share of total crypto market cap, as a percentage.
          example: 58.18
        marketCap:
          type: number
          description: Market capitalisation in USD.
          example: 1254560380643.96
    CryptoDominance:
      type: object
      description: |
        Market-cap dominance breakdown — total market cap and each major coin's share,
        with the freshness of the underlying source data.
      required:
        - totalMarketCap
        - coins
        - asOf
      properties:
        totalMarketCap:
          type: number
          description: Total crypto market capitalisation in USD.
          example: 2156391783530.09
        coins:
          type: array
          description: Per-coin dominance entries, ordered by dominance (largest first).
          items:
            $ref: '#/components/schemas/CryptoDominanceCoin'
        asOf:
          type: object
          description: Freshness metadata for the underlying source data.
          required:
            - globalMetrics
            - assets
            - skewSeconds
            - isStale
          properties:
            globalMetrics:
              type:
                - string
                - 'null'
              format: date-time
              description: Timestamp of the global-metrics snapshot.
              example: '2026-06-19T08:45:00.000Z'
            assets:
              type:
                - string
                - 'null'
              format: date-time
              description: Timestamp of the per-asset snapshot.
              example: '2026-06-19T08:45:00.040Z'
            skewSeconds:
              type:
                - integer
                - 'null'
              description: Skew, in seconds, between the two snapshots.
              example: 0
            isStale:
              type: boolean
              description: Whether the data is considered stale.
              example: false
    CryptoDominanceResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/CryptoDominance'
    Etf:
      type: object
      description: |
        A single exchange-traded fund as returned by the list endpoint. The `etfCode`
        is the exchange ticker (e.g. a TSE code like `1306`) used as the `{code}` path
        param for the info / holdings / prices-history / detail endpoints.
      required:
        - id
        - etfCode
