    FxCorrelation:
      type: object
      description: |
        Rolling correlation matrix across FX, crypto and gold benchmarks over the
        look-back window. `matrix[i][j]` is the Pearson correlation between
        `symbols[i]` and `symbols[j]`.
      required:
        - window
        - asOf
        - samples
        - symbols
        - matrix
      properties:
        window:
          type: string
          description: Look-back window the correlations are computed over.
          example: 90d
        asOf:
          type:
            - string
            - 'null'
          format: date
          description: Date the matrix is as of.
          example: '2026-06-19'
        samples:
          type: integer
          description: Number of daily observations used in the calculation.
          example: 89
        symbols:
          type: array
          description: Row / column labels of the matrix, in order.
          items:
            type: string
          example:
            - DXY
            - EUR/USD
            - GBP/USD
            - USD/JPY
            - USD/CNY
            - AUD/USD
            - USD/SGD
            - BTC/USD
            - XAU/USD
        matrix:
          type: array
          description: Square correlation matrix; `matrix[i][j]` correlates `symbols[i]` with `symbols[j]`.
          items:
            type: array
            items:
              type: number
    FxCorrelationResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/FxCorrelation'
    FxEmStressPair:
      type: object
      description: |
        Emerging-market FX stress reading for a single currency pair — comparing
        recent realised volatility against its 90-day distribution.
      required:
        - pair
        - latestPrice
        - vol30d
        - vol90dMean
        - vol90dSd
        - zScore
        - priceZScore
        - level
        - sampleN
      properties:
        pair:
          type: string
          description: Currency-pair symbol.
          example: USD/CNY
        latestPrice:
          type:
            - number
            - 'null'
          description: Most recent price.
          example: 6.79
        vol30d:
          type:
            - number
            - 'null'
          description: Annualised 30-day realised volatility (%).
          example: 1.42
        vol90dMean:
          type:
            - number
            - 'null'
          description: Mean of the 90-day realised-volatility distribution (%).
          example: 2.39
        vol90dSd:
          type:
            - number
            - 'null'
          description: Standard deviation of the 90-day realised-volatility distribution (%).
          example: 0.63
        zScore:
          type:
            - number
            - 'null'
          description: Z-score of current volatility versus its 90-day distribution.
          example: -1.52
        priceZScore:
          type:
            - number
            - 'null'
          description: Z-score of the latest price versus its 90-day distribution.
          example: -2
        level:
          type: string
          enum:
            - STABLE
            - WARNING
            - PANIC
            - UNKNOWN
          description: Stress classification for this pair.
          example: WARNING
        sampleN:
          type: integer
          description: Number of observations in the sample.
          example: 90
    FxEmStress:
      type: object
      description: Emerging-market FX stress monitor — one entry per tracked currency pair.
      required:
