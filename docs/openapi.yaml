                        - integer
                        - 'null'
                      example: 2025
                    unit:
                      type: string
                      enum:
                        - k_vnd
                        - jpy_m2
                      description: How to format prices.
                      example: k_vnd
                    bands:
                      type: array
                      description: |
                        Percentile colour thresholds. Absent when the market has no banding,
                        in which case the client falls back to its own fixed bands.
                      items:
                        type: number
                    bandMethod:
                      type: string
                      enum:
                        - percentile
                      description: Present only alongside `bands`.
                    usdRate:
                      type: number
                      description: USD value of one unit of local currency. Absent when no FX is available.
                      example: 0.00003966381630640323
    RealEstateWardSummary:
      type: object
      description: Lightweight ward entry for populating a province's ward picker.
      required:
        - wardId
        - wardName
      properties:
        wardId:
          type: integer
          example: 3712
        wardName:
          type: string
          example: Adachi
        wardType:
          type:
            - string
            - 'null'
          enum:
            - isLands
            - null
          description: |
            Disambiguates Japanese wards that share a name. Currently set on one unit only —
            利島村, the island village whose name collides with Toshima ward — and `null`
            everywhere else, including all of Vietnam.
          example: null
    RealEstateProvinceWardsResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RealEstateWardSummary'
    RealEstateProvince:
      type: object
      description: A province / city administrative unit available for real-estate queries.
      required:
        - id
        - name
        - code
        - country
      properties:
        id:
          type: integer
          description: Province identifier.
          example: 2
        name:
          type: string
          description: Province / city name (localized by the `lang` query parameter).
          example: Hà Nội
        code:
          type: string
          description: Short province code.
          example: HN
        country:
          type: string
          description: |
            Lowercase country code. Always present, so a `country=all` response can be
            grouped client-side.
          example: vn
        bbox:
          type:
            - array
            - 'null'
          description: |
            Geographic bounding box `[minLon, minLat, maxLon, maxLat]`. Offshore units are
            excluded — Tokyo's Ogasawara and Izu islands sit roughly 1,000 km from the
            mainland and would otherwise stretch the box past usefulness. `null` when the
            province has no boundary geometry.
          items:
            type: number
          example:
            - 105.286
            - 20.564
            - 106.02
            - 21.385
    RealEstateProvincesResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RealEstateProvince'
    RealEstateJpTransaction:
      type: object
      description: |
        One real transaction as published by MLIT. Unlike the land-price endpoint —
        which aggregates a neighbourhood into median / p25 / p75 — each row here is a
        single sale. Residential land only (住宅地).
      required:
        - tradePriceJpy
        - areaM2
        - areaIsLowerBound
        - pricePerM2Jpy
        - priceYear
        - priceQuarter
      properties:
        districtName:
          type:
            - string
            - 'null'
          description: 地区名 — neighbourhood name, as published.
          example: 日ノ出町
        districtNameEn:
          type:
            - string
            - 'null'
          description: Romaji transcription of `districtName`.
          example: Hinodecho
        nearestStation:
          type:
            - string
            - 'null'
          description: 最寄駅 — nearest station, as published.
          example: 北千住
        nearestStationEn:
          type:
            - string
            - 'null'
          example: Kita-senju
        nearestStationMin:
          type:
            - integer
            - 'null'
          description: Walking minutes to the nearest station.
          example: 9
        tradePriceJpy:
          type: number
          description: 取引価格（総額） — total transaction price, JPY.
          example: 260000000
        areaM2:
          type: number
          description: 面積（㎡） — area in m².
          example: 95
        areaIsLowerBound:
          type: boolean
          description: |
            `true` when the source recorded the area as a bound such as "2000㎡以上", making
            `areaM2` a lower bound rather than an exact figure.
          example: false
        pricePerM2Jpy:
          type: number
          description: Unit price, derived as `tradePriceJpy / areaM2`.
          example: 2736842.11
        priceYear:
          type: integer
          example: 2025
        priceQuarter:
          type: integer
          minimum: 1
          maximum: 4
          example: 3
    RealEstateJpTransactionsResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              description: |
                Transaction rows plus paging metadata. Note the nesting: the rows are at
                `data.data`, and `data.meta` is the route's own metadata, distinct from the
                envelope's `meta`.
