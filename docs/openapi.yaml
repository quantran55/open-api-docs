    RealEstateProvincePrice:
      type: object
      description: |
        One province-level dot for a low-zoom map: coordinates plus a representative
        price. Deliberately carries no ward geometry — a single province's GeoJSON runs
        to several megabytes, which is a lot to download just to draw one dot.
      required:
        - id
        - name
        - code
        - country
        - wardCount
        - unit
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Hồ Chí Minh
        code:
          type: string
          example: HCM
        country:
          type: string
          description: Lowercase country code — picks the colour scale and price format.
          example: vn
        lat:
          type:
            - number
            - 'null'
          description: |
            Representative dot — the mean ward lat/lon, falling back to the centre of the
            boundary bbox. `null` when the province has neither.
          example: 10.7412
        lon:
          type:
            - number
            - 'null'
          example: 106.7215
        bbox:
          type:
            - array
            - 'null'
          description: Bounding box `[minLon, minLat, maxLon, maxLat]`.
          items:
            type: number
          minItems: 4
          maxItems: 4
          example:
            - 106.415837
            - 8.67851
            - 107.531438
            - 10.737193
        outline:
          type:
            - array
            - 'null'
          description: |
            Province boundary as MultiPolygon coordinates (`[lon, lat]`), **heavily
            simplified** for low-zoom drawing. Not for spatial computation — use the
            per-province GeoJSON endpoint when exact geometry matters.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: number
        avgPrice:
          type:
            - number
            - 'null'
          description: Representative average price, in `unit`. `null` when no price data exists.
          example: 53811.68
        minPrice:
          type:
            - number
            - 'null'
          example: 1300
        maxPrice:
          type:
            - number
            - 'null'
          example: 687200
        wardCount:
          type: integer
          description: Wards carrying price data — the denominator behind `avgPrice`.
          example: 168
        unit:
          type: string
          enum:
            - k_vnd
            - jpy_m2
          description: '`k_vnd` for Vietnam, `jpy_m2` for Japan.'
          example: k_vnd
        latestYear:
          type:
            - integer
            - 'null'
          example: 2025
    RealEstateProvincePriceCountryMeta:
      type: object
      description: |
        Colour thresholds and unit for one country. These live in `meta` rather than on
        each province because a threshold is a property of the country, not the province.
      required:
        - unit
        - bands
        - bandMethod
      properties:
        unit:
          type: string
          enum:
            - k_vnd
            - jpy_m2
          example: jpy_m2
        bands:
          type:
            - array
            - 'null'
          description: |
            Percentile colour thresholds. `null` for Vietnam, where the client falls back
            to its own fixed bands.
          items:
            type: number
          example:
            - 120000
            - 240000
            - 410000
            - 780000
        bandMethod:
          type:
            - string
            - 'null'
          enum:
            - percentile
            - null
          example: percentile
        usdRate:
          type:
            - number
            - 'null'
          description: USD value of one unit of local currency at the data period; `null` when no FX is available.
          example: 0.0000068
        latestYear:
          type:
            - integer
            - 'null'
          example: 2025
    RealEstateProvincePricesResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              description: |
                Province rows plus the per-country colour thresholds. Note the nesting: the
                rows are at `data.data`, and `data.meta` is the route's own metadata,
                distinct from the envelope's `meta`.
              required:
                - data
                - meta
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/RealEstateProvincePrice'
                meta:
                  type: object
                  required:
                    - byCountry
                  properties:
                    byCountry:
                      type: object
                      description: Keyed by lowercase country code.
                      additionalProperties:
                        $ref: '#/components/schemas/RealEstateProvincePriceCountryMeta'
    RealEstateWardFeature:
      type: object
      description: |
        One ward feature: price attributes plus boundary geometry. `coordinates` is modelled
        permissively — it is a nested array of `[longitude, latitude]` rings, can be large,
        and is normally passed straight to a mapping library.
