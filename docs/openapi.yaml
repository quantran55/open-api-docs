        unit:
          type: string
          description: Price unit. `k_vnd` means thousands of VND per square metre.
          example: k_vnd
        year:
          type: integer
          description: Year the price schedule applies to.
          example: 2026
        month:
          type: integer
          description: Month the price schedule applies to.
          example: 1
    RealEstateLandPricesResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RealEstateLandPrice'
    NewsArticle:
      type: object
      description: |
        One article, projected for briefing use — the dashboard's thumbnail, language,
        ticker and enrichment fields are deliberately omitted.
      required:
        - title
        - source
        - publishedAt
        - category
        - url
      properties:
        title:
          type: string
          example: Fed holds rates steady as inflation cools
        source:
          type: string
          description: Publisher name.
          example: CNBC Markets
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
          example: '2026-09-16T04:12:00.000Z'
        category:
          type: string
          description: Display category; empty string when the pipeline assigned none.
          example: macroeconomic
        geography:
          type:
            - string
            - 'null'
          example: us
        sentiment:
          type:
            - string
            - 'null'
          enum:
            - positive
            - neutral
            - negative
            - null
          example: positive
        sentimentScore:
          type:
            - number
            - 'null'
          description: Signed sentiment strength; `null` when the article was not classified.
          example: 0.62
        summary:
          type:
            - array
            - 'null'
          description: |
            Short bullet summary. Roughly a fifth of articles have no generated summary —
            those fall back to a single bullet holding the publisher's opening line,
            truncated to 280 characters. Always an array or `null`, never a bare string.
          items:
            type: string
          example:
            - The Federal Reserve left its benchmark rate unchanged at 4.25–4.50%.
        url:
          type: string
          format: uri
          example: https://www.cnbc.com/2026/09/16/fed-holds-rates.html
    NewsFeedResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              description: |
                One page of articles. `total` counts every article matching the filters,
                not just this page — page through the remainder with `offset`.
              required:
                - total
                - returned
                - offset
                - items
              properties:
                total:
                  type: integer
                  description: Articles matching the filters across all pages.
                  example: 143
                returned:
                  type: integer
                  description: Articles in this page.
                  example: 5
                offset:
                  type: integer
                  description: Articles skipped before this page.
                  example: 0
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/NewsArticle'
    NewsSentimentResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              description: |
                Aggregate sentiment over the window. Neutral articles are excluded from
                `positiveRatio` and `score`, so check `decisive` before leaning on the
                verdict — a favourable reading off three decisive articles is noise.
              required:
                - window
                - total
                - classified
                - positive
                - neutral
                - negative
                - decisive
                - overall
              properties:
                window:
                  type: string
                  description: Window actually applied, as a Postgres interval.
                  example: 1 day
                total:
                  type: integer
                  description: Articles published in the window.
                  example: 218
                classified:
                  type: integer
                  description: Articles the pipeline assigned a sentiment to.
                  example: 201
                positive:
                  type: integer
                  example: 96
                neutral:
                  type: integer
                  example: 71
                negative:
                  type: integer
                  example: 34
                decisive:
                  type: integer
                  description: '`positive` + `negative` — the base `positiveRatio` is computed from.'
                  example: 130
                positiveRatio:
                  type:
                    - number
                    - 'null'
                  description: Positive share of decisive articles, 0–1. `null` when nothing was decisive.
                  example: 0.738
                score:
                  type:
                    - number
                    - 'null'
                  description: Sentiment score, 0–100. `null` when nothing was decisive.
                  example: 73.8
                overall:
                  type: string
                  description: Verdict derived from `score`.
                  enum:
                    - Cautious
                    - Neutral
                    - Favourable
                  example: Favourable
    CalendarEvent:
      type: object
      description: |
        One scheduled event. `date` and `time` are the local date–time at the publishing
        market, **not** converted to the caller's timezone — `timezoneLabel` says which
        market that is.
      required:
        - id
        - date
        - country
        - category
        - title
        - symbols
        - source
      properties:
        id:
          type: string
          example: '48213'
        date:
          type: string
          format: date
          example: '2026-09-17'
        time:
          type:
            - string
            - 'null'
          description: '`null` for an all-day event.'
          example: '14:30:00'
        timezone:
          type:
            - string
            - 'null'
          description: IANA timezone of the publishing market.
          example: America/New_York
        timezoneLabel:
          type:
            - string
            - 'null'
          description: Short label for the timezone `date` / `time` are expressed in.
          example: ET
        country:
          type: string
          enum:
            - global
            - us
            - jp
            - vn
            - eu
            - gb
            - au
            - ca
            - nz
            - cn
            - ch
          example: us
        category:
          type: string
          enum:
            - holiday
            - economic
            - asset
          example: economic
        assetClass:
          type:
            - string
            - 'null'
          enum:
            - stock
            - etf
            - bond
            - crypto
            - commodity
            - fx
            - null
          description: '`null` for holidays and pure macro releases.'
          example: etf
        title:
          type: string
          example: CPI (YoY)
        titleLocal:
          type:
            - string
            - 'null'
          description: Native-language name, where the source publishes one.
          example: 消費者物価指数
        description:
          type:
            - string
            - 'null'
        impact:
          type:
            - string
            - 'null'
          enum:
            - high
            - medium
            - low
            - null
          example: high
        actual:
          type:
            - number
            - 'null'
          description: Published figure; `null` until release time.
          example: 2.9
        forecast:
          type:
            - number
            - 'null'
          example: 3.1
        previous:
          type:
            - number
            - 'null'
          example: 3.2
        unit:
          type:
            - string
            - 'null'
          description: Unit of `actual` / `forecast` / `previous`.
          example: percent
        actualText:
          type:
            - string
            - 'null'
          description: Source's own string for the figure — render verbatim when present.
          example: 2.9%
        forecastText:
          type:
            - string
            - 'null'
          example: 3.1%
        previousText:
          type:
            - string
            - 'null'
          example: 3.2%
        symbols:
          type: array
          description: Ticker tags attached to the event.
          items:
            type: string
          example:
            - '1302'
            - '1305'
        subgroup:
          type:
            - string
            - 'null'
          example: No Creation only
        source:
          type: string
          description: Data source — every response names where the figures came from.
          example: investing.com
        sourceUrl:
          type:
            - string
            - 'null'
          format: uri
    CalendarEventsResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              description: |
                One page of events. `total` counts every event matching the filters, so a
                caller told "150 events, 20 returned" can reach the rest with `offset`.
              required:
                - total
                - returned
                - offset
                - items
              properties:
                total:
                  type: integer
                  example: 150
                returned:
                  type: integer
                  example: 20
                offset:
                  type: integer
                  example: 0
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CalendarEvent'
    IndexSnapshot:
      type: object
      description: Latest level and daily move for one index.
      required:
        - symbol
        - market
        - name
      properties:
        symbol:
          type: string
          example: ^GSPC
        market:
          type: string
          enum:
            - vn
            - us
            - jp
            - sea
            - global
          example: us
        name:
          type: string
          example: S&P 500
        price:
          type:
            - number
            - 'null'
          description: Latest level.
          example: 6412.33
        change1d:
          type:
            - number
            - 'null'
          description: |
            Close-to-close change from the previous session. `null` when the previous
            close is unavailable.
          example: 0.42
        asOfDate:
          type:
            - string
            - 'null'
          format: date
          example: '2026-09-15'
        source:
          type:
            - string
            - 'null'
          example: yahoo-finance
    MarketIndicesSnapshotResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              required:
                - market
                - indices
              properties:
                market:
                  type: string
                  description: Market filter that was applied.
                  example: all
                updatedAt:
                  type: string
                  format: date-time
                  description: When the snapshot was last refreshed. Absent when `indices` is empty.
                  example: '2026-09-16T01:05:11.882Z'
                indices:
                  type: array
                  items:
                    $ref: '#/components/schemas/IndexSnapshot'
    GlobalIndex:
      type: object
      description: |
        Latest close for one global index. **`change` and `changePercent` here are
        intraday** (close minus open of the latest bar) — for the daily close-to-close
        move use `change1d` from `/openapi/v1/market/indices/snapshot`.
      required:
        - symbol
        - market
        - close
        - change
        - changePercent
      properties:
        symbol:
          type: string
          example: ^N225
        market:
          type: string
          example: jp
        close:
          type: number
          example: 42180.5
        change:
          type: number
          description: Intraday change — close minus open of the latest bar.
          example: -118.24
        changePercent:
          type: number
          description: Intraday change as a percentage of the open.
          example: -0.28
        date:
          type:
            - string
            - 'null'
          format: date
          example: '2026-09-15'
    MarketGlobalIndicesResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/GlobalIndex'
    EquitySummary:
      type: object
      description: |
        End-of-day snapshot of one Japanese equity. All numbers are raw, in their native
        unit (JPY, shares, %). A block with no data is `null` (or an empty array), never
        an error.
      required:
        - symbol
        - code
        - market
        - exchange
        - currency
        - quote
        - overview
        - tradingActivity
        - periodChanges
        - ratios
      properties:
        symbol:
          type: string
          description: 5-character J-Quants code.
          example: '72030'
        code:
          type: string
          description: Exchange ticker. Preferred shares whose last character is not `0` keep all 5 characters (e.g. `25935`).
          example: '7203'
        market:
          type: string
          enum:
            - jp
          example: jp
        name:
          type:
            - string
            - 'null'
          example: TOYOTA MOTOR CORPORATION
        nameLocal:
          type:
            - string
            - 'null'
          description: Company name in Japanese.
          example: トヨタ自動車
        exchange:
          type: string
          example: Tokyo Stock Exchange
        marketSegment:
          type:
            - string
            - 'null'
          description: TSE market segment (Prime, Standard, Growth).
          example: Prime
        sector:
          type:
            - object
            - 'null'
          description: TSE 33-sector classification.
          properties:
            code:
              type: string
              example: '3700'
            name:
              type:
                - string
                - 'null'
              example: Transportation Equipment
            classification:
              type: string
              enum:
                - TSE33
              example: TSE33
        currency:
          type: string
          enum:
            - JPY
          example: JPY
        quote:
          type: object
          description: |
            Closing price of the latest session (`priceType` is always `close` — not a
            delayed intraday quote). `change` / `changePercent` are the same numbers as
            `periodChanges.change1d`.
          properties:
            price:
              type:
                - number
                - 'null'
              example: 2920
            previousClose:
              type:
                - number
                - 'null'
              example: 2881.5
            change:
              type:
                - number
                - 'null'
              example: 38.5
            changePercent:
              type:
                - number
                - 'null'
              example: 1.3361
            priceType:
              type: string
              enum:
                - close
              example: close
            tradingDate:
              type:
                - string
                - 'null'
              format: date
              example: '2026-09-30'
            closeTime:
              type: string
              description: Session close time in `timezone` (TSE closes at 15:30 JST).
              example: '15:30'
            timezone:
              type: string
              example: Asia/Tokyo
        overview:
          type: object
          properties:
            tradingUnit:
              type: integer
              description: Board lot — 100 shares on every TSE stock.
              example: 100
            sharesOutstanding:
              type:
                - number
                - 'null'
              description: |
                Shares issued **including treasury shares** (the base J-Quants uses for
                `marketCap`). Shares in circulation = `sharesOutstanding − treasuryShares`.
              example: 14594987460
            treasuryShares:
              type:
                - number
                - 'null'
              example: 2753153800
            sharesAsOf:
              type:
                - string
                - 'null'
              format: date
              example: '2026-06-30'
            marketCap:
              type:
                - number
                - 'null'
              description: Market capitalisation in JPY, as published by J-Quants.
              example: 42617363383200
            marketCapAsOf:
              type:
                - string
                - 'null'
              format: date
              example: '2026-09-30'
        tradingActivity:
          type: object
          description: Volume and trading value of the latest session, with % change versus the previous session.
          properties:
            tradingDate:
              type:
                - string
                - 'null'
              format: date
              example: '2026-09-30'
            volume:
              type:
                - number
                - 'null'
              example: 29166700
            volumeChangePercent:
              type:
                - number
                - 'null'
              example: -14.51
            tradingValue:
              type:
                - number
                - 'null'
              description: Trading value in JPY.
              example: 84918791500
            tradingValueChangePercent:
              type:
                - number
                - 'null'
              example: -13.97
        periodChanges:
          type: object
          description: |
            Split-adjusted price change in % over each window. `ytdChange` is measured from
            the last close of the previous year. A window longer than the listing history
            is `null`.
          properties:
            asOf:
              type:
                - string
                - 'null'
              format: date
              example: '2026-09-30'
            change1d:
              type:
                - number
                - 'null'
              example: 1.3361
            change3m:
              type:
                - number
                - 'null'
              example: 4.12
            change6m:
              type:
                - number
                - 'null'
              example: -2.35
            ytdChange:
              type:
                - number
                - 'null'
              example: 6.8
            change12m:
              type:
                - number
                - 'null'
              example: 10.05
            change3y:
              type:
                - number
                - 'null'
              example: 21.4
        ratios:
          type: object
          description: |
            Trailing-twelve-month ratios. `basis` names the reporting period used; `notes`
            explains any `null` ratio: `negative_earnings`, `insufficient_history`,
            `no_price`, `no_book_value`.
          properties:
            peRatio:
              type:
                - number
                - 'null'
              example: 8.3101
            pbRatio:
              type:
                - number
                - 'null'
              example: 0.9268
            roe:
              type:
                - number
                - 'null'
              description: Return on equity, in %.
              example: 12.2259
            eps:
              type:
                - number
                - 'null'
              description: Earnings per share in JPY — sum of the last four periods' EPS.
              example: 351.38
            basis:
              type:
                - object
                - 'null'
              properties:
                type:
                  type: string
                  enum:
                    - TTM
                  example: TTM
                fiscalPeriod:
                  type: string
                  example: 1Q
                periodEnd:
                  type: string
                  format: date
                  example: '2026-06-30'
                disclosedAt:
                  type: string
                  format: date-time
                  example: '2026-08-04T05:00:00Z'
            notes:
              type: array
              items:
                type: string
                enum:
                  - negative_earnings
                  - insufficient_history
                  - no_price
                  - no_book_value
              example: []
    EquityMeta:
      description: |
        Response metadata for the Equities domain. On top of `timestamp`, every equities
        response says where the numbers came from and how fresh they are.
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          properties:
            source:
              type: array
              items:
                type: string
              description: Upstream datasets behind the payload (J-Quants, Yahoo Finance).
              example:
                - jquants:/v2/equities/bars/daily
            as_of:
              type:
                - string
                - 'null'
              description: Date the data refers to (latest trading date, latest fiscal period, …).
              example: '2026-09-30'
            unit:
              type: string
              description: Currency or unit of the numeric fields (`JPY`, `JPY/share`).
              example: JPY
            classification:
              type: string
              enum:
                - RAW
                - COMPUTED
                - RAW+COMPUTED
              description: Whether values are passed through as published, computed by HayInsights, or both.
              example: RAW+COMPUTED
            formula_version:
              type:
                - string
                - 'null'
              description: Version tag of the formulas used for computed fields.
              example: jp-split-adjust-v1
            was_restated:
              type: boolean
              description: Whether any value was restated after first publication.
              example: false
            served_from_cache:
              type: boolean
              description: Whether the response was served from cache.
              example: true
            cache_expires_at:
              type:
                - string
                - 'null'
              format: date-time
              description: When the cached copy expires (6 h; 24 h for financial statements).
              example: '2026-10-01T14:00:00.000Z'
    EquitySummaryResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/EquitySummary'
            meta:
              $ref: '#/components/schemas/EquityMeta'
    EquityEvent:
      description: |
        One corporate event. `type` tells the two shapes apart: a **dividend** (dated by
        its ex-dividend date) or an **earnings release**.
      oneOf:
        - title: Dividend
          type: object
          required:
            - type
            - date
            - exDate
            - amountPerShare
            - currency
            - status
          properties:
            type:
              type: string
              const: dividend
            date:
              type: string
              format: date
              description: Ex-dividend date (same as `exDate`).
              example: '2026-09-29'
            exDate:
              type: string
              format: date
              example: '2026-09-29'
            recordDate:
              type:
                - string
                - 'null'
              format: date
              description: Record date. `null` for events known only from Yahoo Finance.
              example: '2026-09-30'
            dividendPeriod:
              type:
                - string
                - 'null'
              enum:
                - 1Q
                - 2Q
                - 3Q
                - FY
                - null
              example: 2Q
            amountPerShare:
              type: number
              example: 50
            currency:
              type: string
              example: JPY
            status:
              type: string
              enum:
                - expected
                - confirmed
              description: |
                `expected` — estimated from the company's own forecast; `confirmed` — the
                actual payout is published.
              example: confirmed
        - title: Earnings release
          type: object
          required:
            - type
            - date
            - status
          properties:
            type:
              type: string
              const: earnings_release
            date:
              type: string
              format: date
              description: Scheduled announcement date.
              example: '2026-11-05'
            fiscalPeriod:
              type:
                - string
                - 'null'
              enum:
                - 1Q
                - 2Q
                - 3Q
                - FY
                - null
              example: 2Q
            status:
              type: string
              const: scheduled
    EquityEvents:
      type: object
      description: |
        Dividends and earnings releases within ±30 days of today (Tokyo time), nearest
        first. `items` is empty when nothing falls in the window.
      required:
        - asOf
        - window
        - items
      properties:
        asOf:
          type: string
          format: date
          description: Today in Tokyo time — the centre of the window.
          example: '2026-10-01'
        window:
          type: object
          properties:
            from:
              type: string
              format: date
              example: '2026-09-01'
            to:
              type: string
              format: date
              example: '2026-10-31'
        items:
          type: array
          items:
            $ref: '#/components/schemas/EquityEvent'
    EquityEventsResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/EquityEvents'
            meta:
              $ref: '#/components/schemas/EquityMeta'
    EquityPricePoint:
      type: object
      description: One trading day.
      required:
        - date
        - close
        - adjustedClose
      properties:
        date:
          type: string
          format: date
          example: '2026-09-30'
        close:
          type: number
          description: Raw close — the price actually traded that day.
          example: 2920
        adjustedClose:
          type: number
          description: Close adjusted for splits to the share base of the latest session. Use it for charts so the line does not jump at splits.
          example: 2920
        volume:
          type:
            - number
            - 'null'
          description: Raw volume — shares actually traded that day.
          example: 29166700
        adjustedVolume:
          type:
            - number
            - 'null'
          description: Volume on the same share base as `adjustedClose` (a 1:4 split multiplies earlier volume by 4).
          example: 29166700
        tradingValue:
          type:
            - number
            - 'null'
          description: Trading value in JPY (unaffected by splits).
          example: 84918791500
    EquityPrices:
      type: object
      description: Daily price series, oldest to newest.
      required:
        - range
        - isPartial
        - points
      properties:
        range:
          type: string
          enum:
            - 5d
            - 1m
            - 3m
            - 6m
            - 1y
            - 3y
            - 5y
            - max
          example: 1y
        from:
          type:
            - string
            - 'null'
          format: date
          description: First date of the window (`null` for `5d` and `max`).
          example: '2025-10-01'
        to:
          type:
            - string
            - 'null'
          format: date
          description: Latest trading date in the series.
          example: '2026-09-30'
        isPartial:
          type: boolean
          description: '`true` when the requested window is longer than the available history (data starts October 2021).'
          example: false
        points:
          type: array
          items:
            $ref: '#/components/schemas/EquityPricePoint'
    EquityPricesResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/EquityPrices'
            meta:
              $ref: '#/components/schemas/EquityMeta'
    EquityStatementRow:
      type: object
      description: One line item. Rows form a tree — `children` are sub-items of this line.
      required:
        - key
        - label
        - unit
        - values
        - children
      properties:
        key:
          type: string
          example: TotalRevenue
        label:
          type: string
          example: Total Revenue
        unit:
          type: string
          enum:
            - JPY
            - JPY/share
            - shares
            - ratio
          example: JPY
        values:
          type: object
          description: Value per column, keyed by `columns[].key`. A period with no figure is `null`.
          additionalProperties:
            type:
              - number
              - 'null'
          example:
            ttm: 51957026000000
            '2026-03-31': 50684952000000
        children:
          type: array
          items:
            $ref: '#/components/schemas/EquityStatementRow'
    EquityStatementTable:
      type: object
      description: |
        Financial statement as a table: columns are periods, rows are a tree of line
        items. The income statement has TTM + 3 fiscal years; the balance sheet has 4
        fiscal years (no TTM). `columns` and `rows` are empty while the statement has not
        been collected yet.
      required:
        - statement
        - currency
        - columns
        - rows
      properties:
        statement:
          type: string
          enum:
            - income-statement
            - balance-sheet
          example: income-statement
        currency:
          type: string
          example: JPY
        columns:
          type: array
          items:
            type: object
            required:
              - key
              - label
              - periodType
              - periodEnd
            properties:
              key:
                type: string
                description: Key into each row's `values`.
                example: ttm
              label:
                type: string
                description: Display label — the company's actual fiscal year end, e.g. `Mar 31, 2026`.
                example: TTM
              periodType:
                type: string
                enum:
                  - ttm
                  - annual
                example: ttm
              periodEnd:
                type: string
                format: date
                example: '2026-06-30'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/EquityStatementRow'
        dataAsOf:
          type:
            - string
            - 'null'
          format: date
          description: End of the latest period in the table.
          example: '2026-06-30'
        lastUpdatedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Last time HayInsights updated the figures.
          example: '2026-10-01T14:00:12.000Z'
    EquityFinancialStatementsResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/EquityStatementTable'
            meta:
              $ref: '#/components/schemas/EquityMeta'
    EquityRelatedStocks:
      type: object
      description: |
        Peers in the same TSE 33-sector (common shares on Prime / Standard / Growth),
        largest market cap first. When the sector has fewer stocks than `limit`, peers
        from the same market segment fill the list and `basis` becomes `sector33_segment`.
      required:
        - basis
        - items
      properties:
        basis:
          type: string
          enum:
            - sector33
            - sector33_segment
          example: sector33
        sector:
          type:
            - object
            - 'null'
          properties:
            code:
              type: string
              example: '3700'
            name:
              type:
                - string
                - 'null'
              example: Transportation Equipment
        items:
          type: array
          items:
            type: object
            required:
              - symbol
              - code
            properties:
              symbol:
                type: string
                example: '72670'
              code:
                type: string
                example: '7267'
              name:
                type:
                  - string
                  - 'null'
                example: HONDA MOTOR CO.,LTD.
              price:
                type:
                  - number
                  - 'null'
                example: 1520.5
              change:
                type:
                  - number
                  - 'null'
                description: 1-day change, same formula as the snapshot endpoint.
                example: 12
              changePercent:
                type:
                  - number
                  - 'null'
                example: 0.7955
              tradingDate:
                type:
                  - string
                  - 'null'
                format: date
                example: '2026-09-30'
              marketCap:
                type:
                  - number
                  - 'null'
                example: 8235000000000
    EquityRelatedStocksResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/EquityRelatedStocks'
            meta:
              $ref: '#/components/schemas/EquityMeta'
  responses:
    BadRequest:
      description: Invalid or missing parameter — bad enum, range, format, or a missing required query parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            success: false
            statusCode: 400
            error:
              code: INTERNAL_ERROR
              message:
                - Invalid type parameter. Must be "gdp", "cpi", "pce", or "import-export"
                - Type parameter is required
            meta:
              error: Bad Request
              statusCode: 400
              timestamp: '2026-06-19T08:34:08.081Z'
    Unauthorized:
      description: Missing, invalid, disabled or expired API key. Send a valid key in the `X-API-Key` header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            success: false
            statusCode: 401
            error:
              code: API_KEY_INVALID
              message: Invalid API key
            meta:
              timestamp: '2026-06-19T08:34:08.023Z'
    Forbidden:
      description: Your subscription plan does not include this data feature, or your key's scope denies it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            success: false
            statusCode: 403
            error:
              code: FEATURE_NOT_IN_PLAN
              message: Your plan does not include this feature
            meta:
              timestamp: '2026-06-19T08:34:08.100Z'
    RateLimited:
      description: |
        Rate limit exceeded — you have consumed your plan's per-minute weight budget.
        Wait until `X-RateLimit-Reset` (or `Retry-After` seconds) then retry.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
        X-RateLimit-Weight-Used:
          $ref: '#/components/headers/XRateLimitWeightUsed'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            success: false
            statusCode: 429
            error:
              code: RATE_LIMIT_EXCEEDED
              message: Rate limit exceeded
            meta:
              timestamp: '2026-06-19T08:34:09.000Z'
    InternalError:
      description: Unexpected server error. Retry after a short exponential backoff.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            success: false
            statusCode: 500
            error:
              code: INTERNAL_ERROR
              message: Internal server error
            meta:
              timestamp: '2026-06-19T08:34:10.000Z'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            success: false
            statusCode: 404
            error:
              code: INTERNAL_ERROR
              message: Commodity 'zzz-nope' not found
            meta:
              error: Not Found
              statusCode: 404
              timestamp: '2026-06-19T08:34:08.205Z'
  headers:
    XRateLimitLimit:
      description: Your plan's request-weight budget per 1-minute window.
      schema:
        type: integer
        example: 1000
    XRateLimitRemaining:
      description: Remaining request weight in the current 1-minute window.
      schema:
        type: integer
        example: 997
    XRateLimitReset:
      description: Unix timestamp (seconds) when the current rate-limit window resets.
      schema:
        type: integer
        format: int64
        example: 1781857979
    XRateLimitWeightUsed:
      description: Request weight consumed by this call (see each endpoint's weight).
      schema:
        type: integer
        example: 3
    RetryAfter:
      description: Seconds to wait before retrying. Present on 429 responses.
      schema:
        type: integer
        example: 30
x-hayinsights-quota:
  model: weighted-sliding-window
  window: 1m
  unit: weight
  description: |
    Each call consumes its endpoint's weight from your plan's per-minute budget.
    When the budget is exhausted the API returns 429 until the window resets.
  headers:
    limit: X-RateLimit-Limit
    remaining: X-RateLimit-Remaining
    reset: X-RateLimit-Reset
    weightUsed: X-RateLimit-Weight-Used
  exceeded:
    status: 429
    code: RATE_LIMIT_EXCEEDED
    retryAfterHeader: Retry-After
  weightsByTag:
    Macro: 2-3
    Real Estate: 2
    Calendar: 2
    Market: 2
    Equities: 1-3
    News: 2-3
    Commodities: 3
    Crypto: 3
    FX: 3-6
    ETF: 2-8
x-tagGroups:
  - name: Market Data
    tags:
      - Commodities
      - Crypto
      - ETF
      - FX
      - Macro
      - Real Estate
      - News
      - Calendar
      - Market
      - Equities
