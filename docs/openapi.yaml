  /openapi/v1/etf/top-performance:
    get:
      operationId: etfTopPerformance
      tags:
        - ETF
      summary: Top-performing ETFs
      description: |
        ETFs ranked by NAV change over the requested period, best to worst. Use the
        `period` query parameter to choose the look-back window.
      x-feature-code: etf_data
      x-api-weight: 8
      parameters:
        - name: period
          in: query
          required: false
          description: |
            Look-back window for the performance ranking.

            | Value | Description |
            | --- | --- |
            | `1M` | Last 1 month |
            | `6M` | Last 6 months |
            | `1Y` | Last 1 year |
          schema:
            type: string
            enum:
              - 1M
              - 6M
              - 1Y
            default: 1M
