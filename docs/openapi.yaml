    PmiLatest:
      type: object
      description: Summary of the latest month that has a reading.
      required:
        - month
        - value
        - previousMonth
        - previousValue
        - change
        - status
        - streak
        - releasedAt
      properties:
        month:
          type: string
          pattern: ^\d{4}-\d{2}$
          description: Month of the latest reading (`YYYY-MM`).
          example: 2026-09
        value:
          type: number
          description: Latest reading in index points.
          example: 51.9
        previousMonth:
          type: string
          pattern: ^\d{4}-\d{2}$
          description: The month before `month`.
          example: 2026-08
        previousValue:
          type:
            - number
            - 'null'
          description: Reading for `previousMonth`; `null` when that month has no reading.
          example: 53.3
        change:
          type:
            - number
            - 'null'
          description: '`value − previousValue` in index points; `null` when `previousValue` is `null`.'
          example: -1.4
        status:
          type: string
          enum:
            - expansion
            - no_change
            - contraction
          description: '`expansion` above 50, `no_change` at exactly 50, `contraction` below 50.'
          example: expansion
        streak:
          type: object
          description: Consecutive months, counted back from `month`, with the same `status`.
          required:
            - months
            - since
            - isLowerBound
          properties:
            months:
              type: integer
              minimum: 1
              description: Length of the streak, `month` included.
              example: 15
            since:
              type: string
              pattern: ^\d{4}-\d{2}$
              description: First month of the streak.
              example: 2025-07
            isLowerBound:
              type: boolean
              description: |
                `true` when the month before `since` has no reading (a gap, or before the
                first month on record), so the real streak may be longer.
              example: false
        releasedAt:
          type: string
          format: date-time
          description: When S&P Global published the latest reading (UTC).
          example: '2026-10-01T00:30:00.000Z'
    PmiPoint:
      type: object
      description: |
        One month of the PMI series. A month without a reading stays in the list with
        `value: null` — never 0 — so a chart can draw the gap.
      required:
        - month
        - value
        - change
        - status
      properties:
        month:
          type: string
          pattern: ^\d{4}-\d{2}$
          description: Reference month (`YYYY-MM`).
          example: 2026-09
        value:
          type:
            - number
            - 'null'
          description: PMI reading in index points, one decimal as published. `null` when the month has no reading.
          example: 51.9
        change:
          type:
            - number
            - 'null'
          description: |
            Change from the previous month in index points (not percent). `null` when this
            month or the previous one has no reading.
          example: -1.4
        status:
          type:
            - string
            - 'null'
          enum:
            - expansion
            - no_change
            - contraction
            - null
          description: |
            Reading against the 50 line: `expansion` above 50, `no_change` at exactly 50,
            `contraction` below 50. `null` when the month has no reading.
          example: expansion
    PmiManufacturingSeries:
      type: object
      description: |
        S&P Global Vietnam Manufacturing PMI over the requested window, with a summary of
        the latest reading. When nothing is on record (for example an `asOf` before the
        first reading), `from`, `to` and `latest` are `null` and `points` is empty.
      required:
        - country
        - seriesCode
        - threshold
        - period
        - from
        - to
        - latest
        - points
        - source
        - unit
        - wasRestated
      properties:
        country:
          type: string
          enum:
            - vn
          description: Country code, lowercase. Only Vietnam is available.
          example: vn
        seriesCode:
          type: string
          enum:
            - manufacturing_pmi
          description: Series identifier. Vietnam has a manufacturing PMI only.
          example: manufacturing_pmi
        threshold:
          type: number
          description: The 50 line — above it is expansion, below it contraction.
          example: 50
        period:
          type: string
          enum:
            - 3M
            - 6M
            - 1Y
            - 3Y
          description: Window that was applied.
          example: 3M
        from:
          type:
            - string
            - 'null'
          pattern: ^\d{4}-\d{2}$
          description: First month of the window (`YYYY-MM`).
          example: 2026-07
        to:
          type:
            - string
            - 'null'
          pattern: ^\d{4}-\d{2}$
          description: Last month of the window — the latest month with a reading (as known at `asOf`, when given).
          example: 2026-09
        latest:
          oneOf:
            - $ref: '#/components/schemas/PmiLatest'
            - type: 'null'
        points:
          type: array
          description: One entry per month from `from` to `to`, oldest first.
          items:
            $ref: '#/components/schemas/PmiPoint'
        source:
          type: string
          description: Data provider.
          example: S&P Global
        unit:
          type: string
          description: Unit of `value` and `change`.
          example: index_points
        wasRestated:
          type: boolean
          description: '`true` when S&P Global revised any month in the window after first publishing it.'
          example: false
    PmiMeta:
      description: |
        Response metadata for the PMI series. On top of `timestamp`, it says where the
        numbers came from, which fields HayInsights computes, and how fresh the response is.
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          properties:
            source:
              type: string
              description: Data provider.
              example: S&P Global
            series:
              type: string
              description: Full name of the series.
              example: S&P Global Vietnam Manufacturing PMI — headline, seasonally adjusted
            as_of:
              type:
                - string
                - 'null'
              description: Latest month in the window (`YYYY-MM`).
              example: 2026-09
            released_at:
              type:
                - string
                - 'null'
              format: date-time
              description: When S&P Global published the latest reading (UTC).
              example: '2026-10-01T00:30:00.000Z'
            unit:
              type: string
              description: Unit of the numeric fields.
              example: index_points
            classification:
              type: object
              description: |
                How each field was produced: `value` is passed through as S&P Global published
                it; `change`, `status` and `streak` are computed by HayInsights.
              properties:
                value:
                  type: string
                  example: RAW
                change:
                  type: string
                  example: COMPUTED
                status:
                  type: string
                  example: COMPUTED
                streak:
                  type: string
                  example: COMPUTED
            formula_version:
              type: string
              description: Version tag of the formulas behind the computed fields.
              example: pmi-summary-v1
            was_restated:
              type: boolean
              description: Same as `data.wasRestated`.
              example: false
            served_from_cache:
              type: boolean
              description: Whether the response was served from cache.
              example: true
            cache_expires_at:
              type:
                - string
                - 'null'
              format: date-time
              description: When the cached copy expires (24 h; it is dropped as soon as a new reading is collected).
              example: '2026-10-17T01:12:40.000Z'
    MacroPmiManufacturingResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/PmiManufacturingSeries'
            meta:
              $ref: '#/components/schemas/PmiMeta'
    IndicatorColumn:
      type: object
      description: One period (column) of an indicator table.
      required:
        - period
        - date
      properties:
        period:
          type: string
          description: Human-readable period label.
          example: Q1 2026
        date:
          type: string
          format: date
          description: Last calendar day of the period.
          example: '2026-03-31'
    IndicatorRow:
      type: object
      description: |
        One country (row) of an indicator table. `values` and `display` are positional —
        index `n` corresponds to `columns[n]`.
      required:
        - country
        - countryName
        - available
        - values
        - display
      properties:
        country:
          type: string
          description: ISO country code.
          example: US
        countryName:
          type: string
          example: United States
        available:
          type: boolean
          description: '`false` when no series exists for this country — `values` is then all `null`.'
          example: true
        values:
          type: array
          description: Raw numeric value per column; `null` where the period has no observation.
          items:
            type:
              - number
              - 'null'
          example:
            - 5.4
            - 5.4
            - 6.1
            - null
        display:
          type: array
          description: Pre-formatted string per column; an em dash marks a missing value.
          items:
            type: string
          example:
            - '5.40'
            - '5.40'
            - '6.10'
            - —
        basis:
          type:
            - string
            - 'null'
          description: Comparison basis of the figures, when the indicator has one.
          example: YoY
        unit:
          type:
            - string
            - 'null'
          description: Unit override for this row, when it differs from the table unit.
          example: USD/JPY
    MacroIndicatorTableResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              description: |
                A country × period table. `rows[].values` is positionally aligned with
                `columns`, so `rows[0].values[2]` is the value for `columns[2]`.
              required:
                - indicator
                - columns
                - rows
              properties:
                indicator:
                  type: string
                  description: Indicator slug, matching the endpoint path.
                  example: gdp-growth-rate
                unit:
                  type:
                    - string
                    - 'null'
                  description: Unit shared by every row unless a row overrides it.
                  example: '%'
                columns:
                  type: array
                  items:
                    $ref: '#/components/schemas/IndicatorColumn'
                rows:
                  type: array
                  items:
                    $ref: '#/components/schemas/IndicatorRow'
    IndicatorMetric:
      type: object
      description: One metric tracked by a multi-metric indicator table.
      required:
        - key
        - label
      properties:
        key:
          type: string
          description: Key used inside each row's `values` / `display` objects.
          example: exportValue
        label:
          type: string
          example: Export
        unit:
          type:
            - string
            - 'null'
          example: Billion USD
    IndicatorMultiColumn:
      type: object
      description: One period (column) of a multi-metric indicator table.
      required:
        - period
        - date
      properties:
        period:
          type: string
          example: Q2 2026
        date:
          type: string
          format: date
          example: '2026-06-30'
        isPartial:
          type: boolean
          description: '`true` when the period is still in progress and figures may be revised.'
          example: false
    IndicatorMultiRow:
      type: object
      description: |
        One country (row) of a multi-metric indicator table. Each entry of `values` is an
        object keyed by `metrics[].key`, positionally aligned with `columns`.
      required:
        - country
        - countryName
        - available
        - values
        - display
      properties:
        country:
          type: string
          example: US
        countryName:
          type: string
          example: United States
        available:
          type: boolean
          example: true
        unit:
          type:
            - string
            - 'null'
          example: Billion USD
        values:
          type: array
          description: |
            Per-period object of raw metric values, keyed by `metrics[].key`. The whole entry
            is `null` for a period with no data — which is every period when `available` is
            `false`. Within an entry, an individual metric may also be `null`.
          items:
            type:
              - object
              - 'null'
            additionalProperties:
              type:
                - number
                - 'null'
          example:
            - epi: 167.6
              ipi: 150.2
            - null
        display:
          type: array
          description: |
            Per-period object of pre-formatted metric strings. Unlike `values`, an entry is
            always present — an em dash marks a missing figure.
          items:
            type: object
            additionalProperties:
              type: string
          example:
            - epi: '167.60'
              ipi: '150.20'
            - epi: —
              ipi: —
    MacroIndicatorMultiTableResponse:
      allOf:
