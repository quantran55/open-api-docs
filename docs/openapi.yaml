      summary: Transaction-level records for one ward (Japan only)
      description: |
        Each row is a single real transaction published by MLIT — distinct from the
        land-prices endpoint, which aggregates a neighbourhood into median / p25 / p75.
        Covers every quarter held, and drops transactions whose source records area only
        as a bound (e.g. "2000㎡以上"). Residential land only (住宅地).

        Japan only: any other `country` returns `400`.
      x-feature-code: realestate_data
      x-api-weight: 2
      parameters:
        - name: country
          in: path
          required: true
          description: Country code — `jp` only; anything else returns `400`.
          schema:
            type: string
            enum:
              - jp
            example: jp
        - name: wardId
          in: path
          required: true
          description: Ward ID, from the province wards endpoint.
          schema:
            type: integer
            example: 3712
        - name: property_type
          in: query
          required: false
          description: |
            Property category.

            | Value | Description |
            | --- | --- |
            | `land_building` | 宅地(土地と建物) — land with buildings |
            | `land_only` | 宅地(土地) — land only |
          schema:
            type: string
            enum:
              - land_building
              - land_only
            default: land_building
        - name: limit
          in: query
          required: false
          description: |
            Transactions to return. The densest ward currently holds 1,328 transactions in
            a single tab, so the ceiling is set well above it.
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
        - name: offset
          in: query
          required: false
          description: Transactions to skip, for paging.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sort
          in: query
          required: false
          description: |
            Sort order.

            | Value | Description |
            | --- | --- |
            | `unit_price_desc` | Unit price, highest first |
            | `unit_price_asc` | Unit price, lowest first |
            | `price_desc` | Total price, highest first |
            | `price_asc` | Total price, lowest first |
            | `area_desc` | Area, largest first |
