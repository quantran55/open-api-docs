type: object
description: One daily OHLCV bar in an ETF's price history.
required:
  - id
  - date
  - etfCode
  - close
properties:
  id:
    type: integer
    description: Internal numeric identifier of the bar.
    example: 346280
  date:
    type: string
    format: date
    description: Trading date of the bar.
    example: "2021-06-14"
  etfCode:
    type: string
    description: Exchange ticker for the ETF.
    example: "1306"
  open:
    type: string
    description: Opening price. Returned as a decimal **string**, not a number.
    example: "2054.0000"
  high:
    type: string
    description: Session high. Returned as a decimal **string**, not a number.
    example: "2061.0000"
  low:
    type: string
    description: Session low. Returned as a decimal **string**, not a number.
    example: "2046.0000"
  close:
    type: string
    description: Closing price. Returned as a decimal **string**, not a number.
    example: "2048.0000"
  volume:
    type: string
    description: Traded volume for the session.
    example: "573610.000000"
  currency:
    type: string
    description: Quote currency.
    example: JPY
