type: object
description: |
  S&P Global Vietnam Manufacturing PMI over the requested window, with a summary of
  the latest reading. When nothing is on record (for example an `asOf` before the
  first reading), `from`, `to` and `latest` are `null` and `points` is empty.
required:
  - country
  - seriesCode
  - threshold
  - period
  - from
  - to
  - latest
  - points
  - source
  - unit
  - wasRestated
properties:
  country:
    type: string
    enum:
      - vn
    description: Country code, lowercase. Only Vietnam is available.
    example: vn
  seriesCode:
    type: string
    enum:
      - manufacturing_pmi
    description: Series identifier. Vietnam has a manufacturing PMI only.
    example: manufacturing_pmi
  threshold:
    type: number
    description: The 50 line — above it is expansion, below it contraction.
    example: 50
  period:
    type: string
    enum:
      - 3M
      - 6M
      - 1Y
      - 3Y
    description: Window that was applied.
    example: 3M
  from:
    type: ["string", "null"]
    pattern: "^\\d{4}-\\d{2}$"
    description: First month of the window (`YYYY-MM`).
    example: "2026-07"
  to:
    type: ["string", "null"]
    pattern: "^\\d{4}-\\d{2}$"
    description: Last month of the window — the latest month with a reading (as known at `asOf`, when given).
    example: "2026-09"
  latest:
    oneOf:
      - $ref: "./PmiLatest.yaml"
      - type: "null"
  points:
    type: array
    description: One entry per month from `from` to `to`, oldest first.
    items:
      $ref: "./PmiPoint.yaml"
  source:
    type: string
    description: Data provider.
    example: S&P Global
  unit:
    type: string
    description: Unit of `value` and `change`.
    example: index_points
  wasRestated:
    type: boolean
    description: "`true` when S&P Global revised any month in the window after first publishing it."
    example: false
