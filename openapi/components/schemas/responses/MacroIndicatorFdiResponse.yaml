allOf:
  - $ref: ../common/EnvelopeBase.yaml
  - type: object
    required:
      - data
    properties:
      data:
        type: object
        required:
          - indicator
          - metrics
          - columns
          - rows
          - source
        properties:
          indicator:
            type: string
            description: Table identifier.
            example: fdi
          metrics:
            type: array
            items:
              type: object
              required:
                - key
                - label
                - unit
              properties:
                key:
                  type: string
                  description: Metric key.
                  enum:
                    - outward
                    - inward
                  example: outward
                label:
                  type: string
                  description: Display label.
                  example: Outward
                unit:
                  type: string
                  description: Always empty — the unit is on `rows[].unit`.
                  example: ''
          columns:
            type: array
            items:
              type: object
              required:
                - period
                - date
              properties:
                period:
                  type: string
                  description: Quarter label.
                  example: Q3 2026
                date:
                  type: string
                  description: Last day of the quarter.
                  format: date
                  example: '2026-09-30'
            description: The two latest quarters with data in Japan or Vietnam, oldest to newest.
          rows:
            type: array
            items:
              type: object
              required:
                - country
                - countryName
                - available
                - values
              properties:
                country:
                  type: string
                  description: Country code. Always three rows, in this order.
                  enum:
                    - US
                    - JP
                    - VN
                  example: VN
                countryName:
                  type: string
                  description: Country name.
                  example: Japan
                available:
                  type: boolean
                  description: False when the country has no figure in any column (the US for now).
                  example: true
                unit:
                  type:
                    - string
                    - 'null'
                  description: Unit of the row; null when `available` is false.
                  example: Million USD
                values:
                  type: array
                  items:
                    type:
                      - object
                      - 'null'
                    additionalProperties:
                      type:
                        - number
                        - 'null'
                  description: |
                    One cell per column, keyed by metric (`outward`, `inward`). A cell is null when the
                    country has no figure for that quarter. Vietnam's `outward` is always null.
                display:
                  type: array
                  items:
                    type: object
                    additionalProperties:
                      type: string
                markers:
                  type: array
                  items:
                    type: object
                    additionalProperties:
                      type: string
          latestPeriod:
            type:
              - string
              - 'null'
            description: Latest quarter in the table (`YYYY-Qn`).
            example: 2026-Q3
          source:
            type: string
            description: Publisher of the Japanese series. The Vietnam row comes from the Foreign Investment Agency.
            example: JETRO
          knowledgeAt:
            type:
              - string
              - 'null'
            description: When the system learned the figures.
          wasRestated:
            type: boolean
            example: false
