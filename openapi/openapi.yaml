openapi: 3.1.0

info:
  title: HayInsights Open API
  version: 0.1.0
  description: |
    Programmatic access to the **HayInsights** financial-data hub — commodities,
    crypto, ETF, FX, macroeconomic, real-estate, news, economic-calendar and
    market-index datasets, served from a single API surface under `/openapi/v1/*`.

    This specification is the **single source of truth** for the public API
    surface — shared by SDK codegen, the reference docs, and (later) the mock
    server / contract tests.

    ## Authentication

    Every request must carry your API key in the `X-API-Key` header. There is a
    single authentication tier — no request signing. Create and manage keys in
    the HayInsights dashboard (Account → API keys). See **Authentication**.

    ## Plans & quota

    Access to each data domain and your request quota are governed by the
    subscription plan attached to your key. Each endpoint consumes a **weighted**
    amount of your per-minute quota; every response carries `X-RateLimit-*`
    headers. See **Rate limits** and **Plans & features**.
  contact: {}

servers:
  - url: https://api-v2.hayinsights.com
    description: Production

# Baseline: every request must carry X-API-Key. Single auth tier — no signing.
security:
  - HayInsightsApiKey: []

# Machine-readable description of the weighted rate-limit model, so codegen /
# tooling can surface quota behaviour. Informational — not an auth declaration.
x-hayinsights-quota:
  model: weighted-sliding-window
  window: 1m
  unit: weight
  description: |
    Each call consumes its endpoint's weight from your plan's per-minute budget.
    When the budget is exhausted the API returns 429 until the window resets.
  headers:
    limit: X-RateLimit-Limit
    remaining: X-RateLimit-Remaining
    reset: X-RateLimit-Reset
    weightUsed: X-RateLimit-Weight-Used
  exceeded:
    status: 429
    code: RATE_LIMIT_EXCEEDED
    retryAfterHeader: Retry-After
  weightsByTag:
    Macro: "2-3"
    Real Estate: 2
    Calendar: 2
    Market: 2
    Equities: "1-3"
    News: "2-3"
    Commodities: 3
    Crypto: 3
    FX: "3-6"
    ETF: "2-8"

tags:
  - name: Commodities
    description: Spot prices, top movers, gold–DXY correlation and historical series for energy, metals and agricultural commodities.
  - name: Crypto
    description: Crypto market overview, dominance, bubble map, on-chain and derivatives metrics.
  - name: ETF
    description: Exchange-traded fund listings, performance & net-flow rankings, heatmap, holdings, NAV growth, fund composition and Bank of Japan ETF holdings.
  - name: FX
    description: Foreign-exchange summary, live table, 90-day correlation matrix and the emerging-market stress monitor.
  - name: Macro
    description: Macroeconomic indicators — GDP, CPI/PCE, exchange rates, population, central-government debt, policy rates / bond yields, interbank rates, FDI, trade by region and the manufacturing PMI.
  - name: Real Estate
    description: Land prices, transaction-level records, administrative geography (provinces / wards) and choropleth GeoJSON, by country.
  - name: News
    description: Market news headlines with per-article sentiment, plus an aggregate sentiment reading over a rolling window.
  - name: Calendar
    description: Economic calendar — rate decisions, CPI and GDP releases, market holidays and asset-level events.
  - name: Market
    description: Index snapshots and global index closes — levels and daily moves for S&P 500, Nasdaq, Nikkei, VN-Index and others.
  - name: Equities
    description: Japanese stock detail (Tokyo Stock Exchange) — end-of-day snapshot, corporate events, daily prices, financial statements and sector peers.

x-tagGroups:
  - name: Market Data
    tags:
      - Commodities
      - Crypto
      - ETF
      - FX
      - Macro
      - Real Estate
      - News
      - Calendar
      - Market
      - Equities

