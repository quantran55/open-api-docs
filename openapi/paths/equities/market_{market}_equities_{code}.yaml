get:
  operationId: equitySummary
  tags:
    - Equities
  summary: Japan equity snapshot
  description: |
    End-of-day snapshot of one Tokyo Stock Exchange stock: closing quote, company
    overview (segment, TSE 33-sector, shares, market cap), trading volume and value,
    price change over 1D / 3M / 6M / YTD / 12M / 3Y (split-adjusted; YTD from the
    last close of the previous year) and TTM ratios (P/E, P/B, ROE, EPS).

    Prices are **closing** prices of the latest session, not intraday quotes. All
    numbers are raw, in JPY / shares / %.
  x-feature-code: macro_data
  x-api-weight: 2
  parameters:
    - name: market
      in: path
      required: true
      description: Market code. Only `jp` (Tokyo Stock Exchange) is supported for now.
      schema:
        type: string
        enum: [jp]
        example: jp
    - name: code
      in: path
      required: true
      description: Stock code — the 4-character ticker (`7203`) or the 5-character J-Quants code (`72030`).
      schema:
        type: string
        example: "7203"
  responses:
    "200":
      description: Snapshot of the requested stock.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/EquitySummaryResponse.yaml"
          example:
            success: true
            statusCode: 200
            data:
              symbol: "72030"
              code: "7203"
              market: jp
              name: TOYOTA MOTOR CORPORATION
              nameLocal: トヨタ自動車
              exchange: Tokyo Stock Exchange
              marketSegment: Prime
              sector:
                code: "3700"
                name: Transportation Equipment
                classification: TSE33
              currency: JPY
              quote:
                price: 2920
                previousClose: 2881.5
                change: 38.5
                changePercent: 1.3361
                priceType: close
                tradingDate: "2026-09-30"
                closeTime: "15:30"
                timezone: Asia/Tokyo
              overview:
                tradingUnit: 100
                sharesOutstanding: 14594987460
                treasuryShares: 2753153800
                sharesAsOf: "2026-06-30"
                marketCap: 42617363383200
                marketCapAsOf: "2026-09-30"
              tradingActivity:
                tradingDate: "2026-09-30"
