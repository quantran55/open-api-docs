get:
  operationId: equityRelatedStocks
  tags:
    - Equities
  summary: Japan related equities
  description: |
    Peers of the stock in the same TSE 33-sector — common shares on Prime, Standard
    or Growth — ordered by market cap, largest first. When the sector has fewer
    stocks than `limit`, peers from the same market segment fill the list and
    `basis` becomes `sector33_segment`.
  x-feature-code: macro_data
  x-api-weight: 2
  parameters:
    - name: market
      in: path
      required: true
      description: Market code. Only `jp` (Tokyo Stock Exchange) is supported for now.
      schema:
        type: string
        enum: [jp]
        example: jp
    - name: code
      in: path
      required: true
      description: Stock code — the 4-character ticker (`7203`) or the 5-character J-Quants code (`72030`).
      schema:
        type: string
        example: "7203"
    - name: limit
      in: query
      required: false
      description: Maximum number of peers to return.
      schema:
        type: integer
        minimum: 1
        maximum: 12
        default: 6
  responses:
    "200":
      description: Peers of the requested stock.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/EquityRelatedStocksResponse.yaml"
          example:
            success: true
            statusCode: 200
            data:
              basis: sector33
              sector:
                code: "3700"
                name: Transportation Equipment
              items:
                - symbol: "72670"
                  code: "7267"
                  name: HONDA MOTOR CO.,LTD.
                  price: 1520.5
                  change: 12
                  changePercent: 0.7955
                  tradingDate: "2026-09-30"
                  marketCap: 8235000000000
            meta:
              source:
                - jquants:/v2/equities/bars/daily
                - jquants:/v2/equities/master
              as_of: "2026-09-30"
              unit: JPY
              classification: RAW+COMPUTED
              formula_version: price-change-v2
              was_restated: false
              served_from_cache: true
              cache_expires_at: "2026-10-01T14:00:00.000Z"
              timestamp: "2026-10-01T08:00:00.000Z"
    "400":
      description: Unsupported market, or an invalid query parameter.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/ErrorBody.yaml"
          example:
            success: false
            statusCode: 400
            error:
              code: MARKET_NOT_SUPPORTED
              message: Thị trường "us" chưa được hỗ trợ — hiện chỉ có jp
            meta:
              error: Bad Request
              statusCode: 400
              timestamp: "2026-10-01T08:00:00.000Z"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/Forbidden.yaml"
    "404":
      description: The stock code is not in the J-Quants listing or is malformed.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common/ErrorBody.yaml"
          example:
            success: false
            statusCode: 404
            error:
              code: EQUITY_NOT_FOUND
              message: Không tìm thấy mã cổ phiếu 99999
            meta:
              error: Not Found
              statusCode: 404
              timestamp: "2026-10-01T08:00:00.000Z"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
