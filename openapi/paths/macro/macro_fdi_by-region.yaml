get:
  operationId: macroFdiByRegion
  tags:
    - Macro
  summary: Japan FDI by region
  description: |
    Japan's quarterly FDI split across 7 world regions (JETRO, million USD). Defaults to the 4 most
    recent quarters, up to 12, same window for inward and outward. Omit `direction` to get both.
    `regions` keeps a fixed order so each region keeps its colour. Each quarter carries `total` (World)
    and `unallocated` (World minus the regions that have a figure).
  x-feature-code: macro_data
  x-api-weight: 2
  parameters:
    - name: country
      in: query
      required: true
      description: Country. Only `jp` is available; Vietnam is under `/macro/fdi/vn/*`.
      schema:
        type: string
        enum:
          - jp
        example: jp
    - name: quarters
      in: query
      required: false
      description: Number of most recent quarters (1–12).
      schema:
        type: integer
        minimum: 1
        maximum: 12
        default: 4
    - name: from
      in: query
      required: false
      description: First quarter (inclusive).
      schema:
        type: string
        pattern: ^\d{4}-Q[1-4]$
        example: 2025-Q3
    - name: to
      in: query
      required: false
      description: Last quarter (inclusive).
      schema:
        type: string
        pattern: ^\d{4}-Q[1-4]$
        example: 2026-Q2
    - name: direction
      in: query
      required: false
      description: Omit to return both directions.
      schema:
        type: string
        enum:
          - outward
          - inward
    - name: asOf
      in: query
      required: false
      description: 'Backtest: return exactly what the system knew at the end of that day (UTC), not later revisions
        by the source. Omit for the latest data.'
      schema:
        type: string
        format: date
        example: '2026-09-01'
  responses:
    '200':
      description: Quarterly FDI by region.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/responses/MacroFdiByRegionResponse.yaml
          example:
            success: true
            statusCode: 200
            data:
              country: jp
              unit: USD
              unitScale: 1000000
              displayUnit: Million USD
              source: JETRO
              latestPeriod: 2026-Q2
              from: 2026-Q2
              to: 2026-Q2
              quarters: 1
              regions:
                - code: asia
                  name: Asia
                - code: north_america
                  name: North America
              outward:
                - period: 2026-Q2
                  total: 48110.4
                  values:
                    asia: 12045.2
                    north_america: 21876.0
                  unallocated: 14189.2
                  isPreliminary: true
            meta:
              timestamp: '2026-10-16T04:00:00.000Z'
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '429':
      $ref: ../../components/responses/RateLimited.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
