get:
  operationId: macroIndicatorDepositRates
  tags:
    - Macro
  summary: "Indicator — Deposit rates table (US/VN)"
  description: |
    Deposit rate table with one column per tenor (90-days / 6-months / 1-year), each
    holding the single most recent data point. Unlike the other Indicator tables, columns
    here are tenors rather than time periods. Only the US and Vietnam have this table. The
    US only has the 90-days tenor (from /macro/monetary-policy/rates-yields); the other
    two return null. Vietnam uses the state-owned bank group (SOBs) from
    /macro/deposit-rates.
  x-feature-code: macro_data
  x-api-weight: 2
  responses:
    "200":
      description: Deposit rates table.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/MacroIndicatorDepositRatesResponse.yaml"
          example:
            success: true
            statusCode: 200
            data:
              indicator: deposit-rates
              unit: "%"
              tenors:
                - key: 90d
                  label: 90-days
                - key: 6m
                  label: 6-months
                - key: 1y
                  label: 1-year
              rows:
                - country: VN
                  countryName: Vietnam
                  available: true
                  date: "2026-09-10"
                  values: [2.38, 3.63, 5.9]
                  display: ["2.38", "3.63", "5.90"]
                - country: US
                  countryName: United States
                  available: true
                  date: "2026-09-12"
                  values: [4.21, null, null]
                  display: ["4.21", "—", "—"]
            meta:
              timestamp: "2026-09-16T08:50:42.507Z"
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/Forbidden.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
