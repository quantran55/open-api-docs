get:
  operationId: macroIndicatorExchangeRates
  tags:
    - Macro
  summary: "Indicator — Exchange rates table"
  description: |
    Daily exchange rate table for JP and VN, `columns` holding the N most recent days
    (default 4). Each economy quotes a different pair, so the pair label (USD/JPY ·
    USD/VND) sits on `rows[].unit` rather than on the table. USD/JPY comes from the same
    source as /macro/exchange-rate; USD/VND is the State Bank of Vietnam selling rate
    (`usd_nhnn_ban_ra`, the same WiFeed source as /macro/exchange-rates). The two sources
    publish on different days, so a missing cell returns null.
  x-feature-code: macro_data
  x-api-weight: 2
  parameters:
    - name: limit
      in: query
      required: false
      description: Number of most recent periods (columns) to return.
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 4
        example: 4
  responses:
    "200":
      description: Exchange rates table.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/MacroIndicatorTableResponse.yaml"
          example:
            success: true
            statusCode: 200
            data:
              indicator: gdp-growth-rate
              unit: "%"
              columns:
                - period: Q3 2025
                  date: "2025-09-30"
                - period: Q4 2025
                  date: "2025-12-31"
                - period: Q1 2026
                  date: "2026-03-31"
              rows:
                - country: US
                  countryName: United States
                  available: true
                  values: [2.1, 2.4, 5.4]
                  display: ["2.10", "2.40", "5.40"]
                  basis: YoY
                - country: JP
                  countryName: Japan
                  available: true
                  values: [0.3, 0.1, null]
                  display: ["0.30", "0.10", "—"]
                  basis: QoQ
            meta:
              timestamp: "2026-09-16T08:50:42.507Z"
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/Forbidden.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
