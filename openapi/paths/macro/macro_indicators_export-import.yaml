get:
  operationId: macroIndicatorExportImport
  tags:
    - Macro
  summary: "Indicator — Export/Import value & balance table (US/JP/VN)"
  description: |
    Monthly table of export value, import value and trade balance for all three economies,
    each cell holding all three metrics. `columns` holds the N most recent months (default
    2). Each economy reports in its own unit, so `unit` sits on the row (JP: Billion Yen,
    US/VN: Billion USD). Columns flagged `isPartial` are incomplete periods. Same source
    as /macro/trade/turnover.
  x-feature-code: macro_data
  x-api-weight: 2
  parameters:
    - name: limit
      in: query
      required: false
      description: Number of most recent periods (columns) to return.
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 4
        example: 2
  responses:
    "200":
      description: Export/import value & balance table.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/MacroIndicatorMultiTableResponse.yaml"
          example:
            success: true
            statusCode: 200
            data:
              indicator: export-import
              metrics:
                - key: exportValue
                  label: Export
                  unit: ""
                - key: importValue
                  label: Import
                  unit: ""
                - key: balance
                  label: Trade Balance
                  unit: ""
              columns:
                - period: Q2 2026
                  date: "2026-06-30"
                  isPartial: false
                - period: Q3 2026
                  date: "2026-09-30"
                  isPartial: true
              rows:
                - country: US
                  countryName: United States
                  available: true
                  unit: Billion USD
                  values:
                    - exportValue: 634.36
                      importValue: 929.72
                      balance: -295.36
                    - exportValue: 197.45
                      importValue: 332.92
                      balance: -135.47
                  display:
                    - exportValue: "634.36"
                      importValue: "929.72"
                      balance: "-295.36"
                    - exportValue: "197.45"
                      importValue: "332.92"
                      balance: "-135.47"
            meta:
              timestamp: "2026-09-16T07:25:17.048Z"
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/Forbidden.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
