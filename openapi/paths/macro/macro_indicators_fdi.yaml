get:
  operationId: macroIndicatorFdi
  tags:
    - Macro
  summary: Indicator — FDI table (JP)
  description: |
    Japan's outward and inward foreign direct investment for the two most recent quarters that have data
    (JETRO publishes with a ~2-month lag, so the columns are not anchored to today), oldest to newest.
    Rows are the two directions — Outward, then Inward — always both, with `available: false` when a
    direction has no figure. Values are in million USD as published by JETRO: `values` holds the raw
    numbers and `display` the formatted strings. Missing periods are null, never 0; a negative value is
    a net withdrawal. For a longer window use `/macro/fdi/flows`.
  x-feature-code: macro_data
  x-api-weight: 2
  parameters:
    - name: country
      in: query
      required: false
      description: Only `jp` is available for now.
      schema:
        type: string
        enum:
          - jp
        default: jp
    - name: asOf
      in: query
      required: false
      description: 'Backtest: return exactly what the system knew at the end of that day (UTC), not later revisions
        by the source. Omit for the latest data.'
      schema:
        type: string
        format: date
        example: '2026-09-01'
  responses:
    '200':
      description: FDI indicator table.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/responses/MacroIndicatorFdiResponse.yaml
          example:
            success: true
            statusCode: 200
            data:
              indicator: fdi
              metrics:
                - key: outward
                  label: Outward
                  unit: Million USD
                - key: inward
                  label: Inward
                  unit: Million USD
              columns:
                - period: 2026-Q1
                  date: '2026-01-01'
                - period: 2026-Q2
                  date: '2026-04-01'
              rows:
                - country: JP
                  countryName: Japan
                  available: true
                  unit: Million USD
                  values:
                    - outward: 53261.8
                      inward: 5729.2
                    - outward: 48110.4
                      inward: 6120.9
                  display:
                    - outward: 53,261.8
                      inward: 5,729.2
                    - outward: 48,110.4
                      inward: 6,120.9
                  markers:
                    - {}
                    - {}
              latestPeriod: 2026-Q2
              source: JETRO
              knowledgeAt: '2026-09-10T00:00:00.000Z'
              wasRestated: false
            meta:
              timestamp: '2026-10-16T04:00:00.000Z'
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '429':
      $ref: ../../components/responses/RateLimited.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
