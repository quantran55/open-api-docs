get:
  operationId: macroIndicatorPmi
  tags:
    - Macro
  summary: "Indicator — Manufacturing PMI table (US/JP/VN)"
  description: |
    Table of the S&P Global manufacturing PMI for all three economies, in index points
    as published (one decimal; 50 = no change from the previous month). `columns`
    holds the N most recent consecutive months (default 4), oldest first, counted back
    from the latest month that has a reading; a month without a reading keeps its
    column, with `null` in `values` and "—" in `display`.

    The US and JP publish a flash reading during the survey month, so in the second
    half of a month the newest column can hold flash values for US and JP while the VN
    cell stays empty until Vietnam publishes (first working day of the next month).
    Cells show the latest reading, flash or final, without saying which — use
    `GET /macro/pmi/{country}/manufacturing` for `releaseStage`.

    Source: S&P Global.
  x-feature-code: macro_data
  # Fixed page URL: the API button of the PMI table (By Indicator) links straight here.
  x-mint:
    href: /api-reference/macro/indicators-pmi
  x-api-weight: 2
  parameters:
    - name: limit
      in: query
      required: false
      description: Number of most recent months (columns) to return.
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 4
        example: 4
  responses:
    "200":
      description: Manufacturing PMI table.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/MacroIndicatorTableResponse.yaml"
          example:
            success: true
            statusCode: 200
            data:
              indicator: pmi
              unit: points
              columns:
                - period: Jul 2026
                  date: "2026-07-31"
                - period: Aug 2026
                  date: "2026-08-31"
                - period: Sep 2026
                  date: "2026-09-30"
                - period: Oct 2026
                  date: "2026-10-31"
              rows:
                - country: US
                  countryName: United States
                  available: true
                  values: [53.9, 53.9, 55.9, 54.9]
                  display: ["53.9", "53.9", "55.9", "54.9"]
                - country: JP
                  countryName: Japan
                  available: true
                  values: [54.5, 54.9, 54.1, 53.3]
                  display: ["54.5", "54.9", "54.1", "53.3"]
                - country: VN
                  countryName: Vietnam
                  available: true
                  values: [52.9, 53.3, 51.9, 52.3]
                  display: ["52.9", "53.3", "51.9", "52.3"]
            meta:
              timestamp: "2026-11-03T03:00:00.000Z"
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/Forbidden.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
