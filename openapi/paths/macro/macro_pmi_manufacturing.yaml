get:
  operationId: macroPmiManufacturing
  tags:
    - Macro
  summary: Manufacturing PMI by country (S&P Global)
  description: |
    Monthly S&P Global Manufacturing PMI for Vietnam, the United States or Japan — the
    headline, seasonally adjusted index, in index points. 50 means no change from the
    previous month; above 50 is expansion, below 50 contraction.

    `points` has one entry per month in the window, oldest first; a month without a
    reading stays in the list with `value: null` — never 0. `latest` summarises the
    newest reading: the change from the previous month in points, the status against
    50, and how many consecutive months it has held that status.

    **Flash and final readings.** The United States and Japan publish a preliminary
    *flash* reading in the second half of the survey month and the *final* reading on
    the first working day of the next month. `releaseStage` says which one a value
    is. Once the final reading is out it replaces the flash, so the newest month's
    `value`, `change`, `status` and `streak` can change between the two releases.
    Vietnam publishes final readings only.

    Pass `asOf` to get the series as it was known at the end of a past day
    (point-in-time, for backtests) — including a flash reading that was later
    replaced.

    Source: S&P Global.
  x-feature-code: macro_data
  # Fixed page URL: the PMI chart's API button in the HayInsights app (all three countries) links straight here.
  x-mint:
    href: /api-reference/macro/pmi-vn-manufacturing
  x-api-weight: 2
  parameters:
    - name: country
      in: path
      required: true
      description: "Country, case-insensitive: `vn` (Vietnam), `us` (United States) or `jp` (Japan)."
      schema:
        type: string
        enum:
          - vn
          - us
          - jp
        example: us
    - name: period
      in: query
      required: false
      description: |
        Window length, counted back from the latest month that has a reading (that
        month included). Case-insensitive.

        | Value | Months |
        | --- | --- |
        | `3M` | 3 |
        | `6M` | 6 |
        | `1Y` | 12 |
        | `3Y` | 36 |
      schema:
        type: string
        enum:
          - 3M
          - 6M
          - 1Y
          - 3Y
        default: 1Y
        example: 3M
    - name: asOf
      in: query
      required: false
      description: |
        Point-in-time date (`YYYY-MM-DD`): return only what was known by the end of
        that day (UTC), leaving out readings and revisions published later. Omit for
        the latest data.
      schema:
        type: string
        format: date
        example: "2026-11-01"
  responses:
    "200":
      description: Monthly PMI series for the requested country and window.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/MacroPmiManufacturingResponse.yaml"
          example:
            success: true
            statusCode: 200
            data:
              country: us
              seriesCode: manufacturing_pmi
              threshold: 50
              period: 3M
              from: "2026-08"
              to: "2026-10"
              latest:
                month: "2026-10"
                value: 54.9
                previousMonth: "2026-09"
                previousValue: 55.9
                change: -1.0
                status: expansion
                streak:
                  months: 15
                  since: "2025-08"
                  isLowerBound: false
                releasedAt: "2026-11-02T14:45:00.000Z"
                releaseStage: final
              points:
                - month: "2026-08"
                  value: 53.9
                  change: 0.0
                  status: expansion
                  releaseStage: final
                - month: "2026-09"
                  value: 55.9
                  change: 2.0
                  status: expansion
                  releaseStage: final
                - month: "2026-10"
                  value: 54.9
                  change: -1.0
                  status: expansion
                  releaseStage: final
              source: S&P Global
              unit: index_points
              wasRestated: false
            meta:
              source: S&P Global
              series: S&P Global US Manufacturing PMI — headline, seasonally adjusted
              as_of: "2026-10"
              released_at: "2026-11-02T14:45:00.000Z"
              release_stage: final
              unit: index_points
              classification:
                value: RAW
                release_stage: RAW
                change: COMPUTED
                status: COMPUTED
                streak: COMPUTED
              formula_version: pmi-summary-v1
              was_restated: false
              served_from_cache: true
              cache_expires_at: "2026-11-04T01:12:40.000Z"
              timestamp: "2026-11-03T03:00:00.000Z"
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/Forbidden.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
