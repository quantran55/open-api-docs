get:
  operationId: newsSentiment
  tags:
    - News
  summary: Aggregate news sentiment
  description: |
    Overall news sentiment across the window: Cautious / Neutral / Favourable, plus
    a 0–100 score and the article counts behind it. Defaults to the last 24 hours.
    Neutral articles are excluded from the ratio, so check `decisive` before leaning
    on the verdict.
  x-feature-code: macro_data
  x-api-weight: 2
  parameters:
    - name: window
      in: query
      required: false
      description: |
        Analysis window. Defaults to the last 24 hours.

        | Value | Description |
        | --- | --- |
        | `1d` | Last 24 hours |
        | `7d` | Last 7 days |
        | `30d` | Last 30 days |
      schema:
        type: string
        enum: [1d, 7d, 30d]
        default: 1d
  responses:
    "200":
      description: Aggregate sentiment for the window.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/NewsSentimentResponse.yaml"
          example:
            success: true
            statusCode: 200
            data:
              window: 1 day
              total: 218
              classified: 201
              positive: 96
              neutral: 71
              negative: 34
              decisive: 130
              positiveRatio: 0.738
              score: 73.8
              overall: Favourable
            meta:
              timestamp: "2026-09-16T08:50:42.507Z"
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/Forbidden.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
