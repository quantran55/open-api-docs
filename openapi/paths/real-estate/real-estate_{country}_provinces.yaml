get:
  operationId: realEstateProvinces
  tags:
    - Real Estate
  summary: List provinces
  description: |
    Provinces / cities available for real-estate queries: `id`, `name`, `code`,
    `country` and `bbox` for each. Pass `country=all` to combine every country — each
    province carries its own `country` field so the client can group them.
  x-feature-code: realestate_data
  x-api-weight: 2
  parameters:
    - name: country
      in: path
      required: true
      description: |
        Country code, or `all` to combine every country.

        | Value | Description |
        | --- | --- |
        | `vn` | Vietnam |
        | `jp` | Japan |
        | `all` | Vietnam and Japan together |
      schema:
        type: string
        enum: [vn, jp, all]
        example: vn
    - name: lang
      in: query
      required: false
      description: |
        Language for localized names.

        | Value | Description |
        | --- | --- |
        | `vi` | Vietnamese |
        | `en` | English |
      schema:
        type: string
        enum:
          - vi
          - en
        default: vi
  responses:
    "200":
      description: List of provinces / cities.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/RealEstateProvincesResponse.yaml"
          example:
            success: true
            statusCode: 200
            data:
              - id: 2
                name: Hà Nội
                code: HN
                country: vn
                bbox: [105.286, 20.564, 106.02, 21.385]
              - id: 1
                name: Hồ Chí Minh
                code: HCM
                country: vn
                bbox: [106.415837, 8.67851, 107.531438, 10.737193]
            meta:
              timestamp: "2026-06-19T08:54:29.672Z"
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/Forbidden.yaml"
    "404":
      $ref: "../../components/responses/NotFound.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
